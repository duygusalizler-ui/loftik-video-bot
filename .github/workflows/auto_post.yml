name: Loftik Otomatik Ürün Videosu

on:
  # GitHub'ın kendi `schedule:` tetikleyicisi bu repoda hic ates almadi
  # (kanit: butun run gecmisi "workflow_dispatch" -- tek bir "schedule"
  # event'i bile yok). Bu yuzden zamanlamayi disaridan (cron-job.org gibi
  # ucretsiz bir servisten) bu workflow_dispatch endpoint'ine POST atarak
  # yapiyoruz. Kurulum icin README.md'ye bak.
  workflow_dispatch:
    inputs:
      limit_yok:
        description: "Deneme: günlük içerik limitini atla"
        type: boolean
        default: false
      mod:
        description: "Deneme: içerik modu (boş = repo ayarı; gonderi / reklam)"
        type: string
        default: ""
  # Yedek zamanlama: cron-job.org calismazsa diye GitHub'in kendi cron'u da
  # acik. Iki tetikleyici ayni gun ust uste calissa bile MAX_POSTS_PER_DAY
  # (varsayilan 2) asilmaz -- fazla calisma sessizce cikar.
  # GitHub cron'u bu repoda 4-6 saat GECIKMELI calisiyor (Ekim 2026 kayitlari:
  # 07:40 UTC tetigi ~14:00, 15:40 tetigi ~20:00 UTC'de ates aldi). Bu yuzden
  # erken ve yogun olmayan dakikalarda birden fazla tetik var; gunluk limit (2)
  # ve "2. icerik TR 14:00'dan once uretilmez" kurali fazlasini sessizce eler.
  # UTC 03:17,05:17 = TR 06:17,08:17 (ogle paylasimi icin)
  # UTC 11:17,13:17 = TR 14:17,16:17 (aksam paylasimi icin)
  schedule:
    - cron: "17 3,5,11,13 * * *"

concurrency:
  group: loftik-video-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Remotion bağımlılıklarını kur
        working-directory: remotion
        run: npm install

      - name: Otomasyonu çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COMPETITOR_PAGES: ${{ vars.COMPETITOR_PAGES }}
          CONTENT_MODE: ${{ inputs.mod || vars.CONTENT_MODE }}
          POST_ANGLES: ${{ vars.POST_ANGLES }}
          IGNORE_DAILY_LIMIT: ${{ inputs.limit_yok && 'true' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: posted.json değişikliğini kaydet
        run: |
          git config user.name "loftik-video-bot"
          git config user.email "actions@github.com"
          git add data/posted.json data/rakip_raporlari || git add data/posted.json
          git diff --cached --quiet || git commit -m "chore: posted.json ve rakip raporu güncellendi [skip ci]"
          git push
